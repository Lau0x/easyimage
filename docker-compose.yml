services:
  piclite:
    image: ghcr.io/lau0x/piclite:latest
    ports:
      - "8080:80"
    environment:
      TZ: Asia/Shanghai
      LITE_DISABLE_LEGACY_CONFIG: ${LITE_DISABLE_LEGACY_CONFIG:-}
      LITE_BASE_URL: ${LITE_BASE_URL:-}
      LITE_APP_PATH: ${LITE_APP_PATH:-}
      LITE_TIMEZONE: ${LITE_TIMEZONE:-}
      LITE_ADMIN_USER: ${LITE_ADMIN_USER:-}
      LITE_ADMIN_PASSWORD_HASH: ${LITE_ADMIN_PASSWORD_HASH:-}
      LITE_ADMIN_PASSWORD_HASH_FILE: ${LITE_ADMIN_PASSWORD_HASH_FILE:-}
      LITE_MAX_FILE_SIZE: ${LITE_MAX_FILE_SIZE:-}
      LITE_MAX_FILES: ${LITE_MAX_FILES:-}
      LITE_TRUSTED_PROXY: ${LITE_TRUSTED_PROXY:-}
      LITE_TRUSTED_PROXY_IPS: ${LITE_TRUSTED_PROXY_IPS:-}
      LITE_CLIENT_IP_HEADER: ${LITE_CLIENT_IP_HEADER:-}
      LITE_API_ENABLED: ${LITE_API_ENABLED:-}
    volumes:
      - ./i:/var/www/html/i
      - ./config:/var/www/html/config
      - ./admin/logs:/var/www/html/admin/logs
    restart: unless-stopped
