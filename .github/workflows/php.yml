name: PHP Lint

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Lint PHP files
        run: docker run --rm -v "$PWD":/work -w /work php:8.3-cli sh -c 'find app admin api install -name "*.php" -print0 | xargs -0 -n1 php -l'
