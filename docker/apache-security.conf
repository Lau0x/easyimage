<Directory "/var/www/html/i">
    Options -Indexes -ExecCGI -Includes
    AllowOverride None

    <FilesMatch "(?i)(?:^|\.)(?:php[0-9]*|phtml|pht|phar|phps|shtml|cgi|pl)(?:\.|$)">
        Require all denied
    </FilesMatch>
</Directory>

<Directory "/var/www/html/config">
    Options -Indexes -ExecCGI -Includes
    AllowOverride None
    Require all denied
</Directory>

<Directory "/var/www/html/admin/logs">
    Options -Indexes -ExecCGI -Includes
    AllowOverride None

    <FilesMatch "(?i)(?:^|\.)(?:php[0-9]*|phtml|pht|phar|phps|shtml|cgi|pl)(?:\.|$)">
        Require all denied
    </FilesMatch>
</Directory>
